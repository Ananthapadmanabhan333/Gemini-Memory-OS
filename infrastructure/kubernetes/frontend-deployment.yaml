apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-os-frontend
  labels:
    app: memory-os-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: memory-os-frontend
  template:
    metadata:
      labels:
        app: memory-os-frontend
    spec:
      containers:
      - name: frontend
        image: memory-os-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://backend-service:8000/api/v1"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: memory-os-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
  type: LoadBalancer
