version: "3.8"

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:talent_os_2026@postgres:5432/memory_os
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=talent_os_password
      - REDIS_URL=redis://redis:6379/0
      - USE_LOCAL_VECTOR_STORE=false
      - USE_LOCAL_GRAPH_STORE=false
      - USE_LOCAL_QUEUE=false
    depends_on:
      - postgres
      - qdrant
      - neo4j
      - redis
    networks:
      - memory_network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
    depends_on:
      - backend
    networks:
      - memory_network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=talent_os_2026
      - POSTGRES_DB=memory_os
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - memory_network

  qdrant:
    image: qdrant/qdrant:v1.7.0
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    networks:
      - memory_network

  neo4j:
    image: neo4j:5.12-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/talent_os_password
    volumes:
      - neo4jdata:/data
    networks:
      - memory_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - memory_network

networks:
  memory_network:
    driver: bridge

volumes:
  pgdata:
  qdrantdata:
  neo4jdata:
